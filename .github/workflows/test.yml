name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ['3.8', '3.9', '3.10', '3.11']
      - run: make install
      - run: make lint
      - run: make test